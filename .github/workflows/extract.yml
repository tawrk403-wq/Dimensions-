
name: Inspect DIMENSIONS Android build

on:
  push:
    paths:
      - ".github/workflows/extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -t dimensions_-the-nightmare-beyond-reality.zip
          mkdir -p extracted-project
          unzip -q dimensions_-the-nightmare-beyond-reality.zip -d extracted-project

      - name: Read Android build instructions
        run: |
          echo "===== APK README ====="
          cat extracted-project/android-apk/README-APK.md

          echo "===== BUILD SCRIPT ====="
          sed -n '1,240p' extracted-project/android-apk/build-apk.sh

          echo "===== PACKAGE CONFIGURATION ====="
          cat extracted-project/package.json

          echo "===== CAPACITOR CONFIGURATION ====="
          cat extracted-project/android-apk/capacitor.config.json

          echo "===== INTERNAL BUILD WORKFLOW ====="
          sed -n '1,260p' extracted-project/.github/workflows/build-android-apk.yml
          
