
name: Build DIMENSIONS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          find . -maxdepth 3 -type f | head -200

      - name: Check ZIP file
        run: |
          unzip -t dimensions_-the-nightmare-beyond-reality.zip

      - name: Extract project
        run: |
          mkdir -p extracted-project
          unzip -o dimensions_-the-nightmare-beyond-reality.zip -d extracted-project

      - name: Show Android build files
        run: |
          find extracted-project -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \)
