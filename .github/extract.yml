
name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted-project
          unzip -o "dimensions_-the-nightmare-beyond-reality.zip" -d extracted-project

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted-project
          git diff --cached --quiet || git commit -m "Extract complete project"
          git push
          
